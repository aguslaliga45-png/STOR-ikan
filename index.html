<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Gudang Realtime Sync</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Firebase SDK (Compat Version) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-10">

  <!-- Header -->
  <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-50">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold flex items-center gap-2">
        <i class="fa-solid font-boxes-stacked"></i> Stok Gudang Sync
      </h1>
      <span id="sync-status" class="text-xs bg-indigo-800 px-2.5 py-1 rounded-full flex items-center gap-1">
        <span class="w-2 h-2 rounded-full bg-yellow-400 animate-pulse"></span> Connecting...
      </span>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- Card Tambah Barang -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
      <h2 class="font-semibold text-slate-700 mb-3 flex items-center gap-2">
        <i class="fa-solid fa-plus-circle text-indigo-600"></i> Tambah Barang Baru
      </h2>
      <form id="form-barang" class="space-y-3">
        <div>
          <label class="text-xs font-medium text-slate-500">Nama Barang</label>
          <input type="text" id="nama" placeholder="Contoh: Semen Gresik 50kg" required class="w-full mt-1 p-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs font-medium text-slate-500">Kode / SKU</label>
            <input type="text" id="sku" placeholder="SKU-001" required class="w-full mt-1 p-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <label class="text-xs font-medium text-slate-500">Kategori</label>
            <input type="text" id="kategori" placeholder="Material" required class="w-full mt-1 p-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs font-medium text-slate-500">Jumlah Stok</label>
            <input type="number" id="stok" min="0" placeholder="0" required class="w-full mt-1 p-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <label class="text-xs font-medium text-slate-500">Satuan</label>
            <input type="text" id="satuan" placeholder="Pcs / Sak / Box" required class="w-full mt-1 p-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-lg text-sm font-semibold transition shadow-sm">
          Simpan Ke Gudang
        </button>
      </form>
    </div>

    <!-- Filter & Pencarian -->
    <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-sm"></i>
        <input type="text" id="search" onkeyup="filterBarang()" placeholder="Cari nama atau SKU barang..." class="w-full pl-9 pr-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
      </div>
    </div>

    <!-- Ringkasan Info -->
    <div class="grid grid-cols-2 gap-2 text-center">
      <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
        <p class="text-xs text-slate-500">Total Jenis Barang</p>
        <p id="total-jenis" class="text-lg font-bold text-slate-800">0</p>
      </div>
      <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
        <p class="text-xs text-slate-500">Total Stok Fisik</p>
        <p id="total-stok" class="text-lg font-bold text-indigo-600">0</p>
      </div>
    </div>

    <!-- Daftar Stok Barang -->
    <div class="space-y-2">
      <h3 class="font-semibold text-slate-700 text-sm flex items-center justify-between">
        <span>Daftar Stok Realtime</span>
        <span class="text-xs text-slate-400 font-normal">Otomatis Sync</span>
      </h3>
      <div id="list-barang" class="space-y-2">
        <div class="text-center py-8 text-slate-400 text-sm">Memuat data gudang...</div>
      </div>
    </div>

  </main>

  <script>
    // ==========================================
    // CONFIG FIREBASE (GANTI DENGAN KUNCI ANDA)
    // ==========================================
    const firebaseConfig = {
      apiKey: "API_KEY_ANDA",
      authDomain: "PROJECT_ID_ANDA.firebaseapp.com",
      databaseURL: "https://PROJECT_ID_ANDA-default-rtdb.firebaseio.com",
      projectId: "PROJECT_ID_ANDA",
      storageBucket: "PROJECT_ID_ANDA.appspot.com",
      messagingSenderId: "SENDER_ID",
      appId: "APP_ID"
    };

    // Inisialisasi Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const refGudang = db.ref('gudang');

    // Cek koneksi realtime
    db.ref('.info/connected').on('value', (snap) => {
      const statusEl = document.getElementById('sync-status');
      if (snap.val() === true) {
        statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span> Online (Sync)`;
        statusEl.className = "text-xs bg-emerald-900 text-emerald-200 px-2.5 py-1 rounded-full flex items-center gap-1.5";
      } else {
        statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-rose-400"></span> Offline`;
        statusEl.className = "text-xs bg-rose-900 text-rose-200 px-2.5 py-1 rounded-full flex items-center gap-1.5";
      }
    });

    let dataBarangGudang = {};

    // 1. TAMBAH BARANG KE DATABASE
    document.getElementById('form-barang').addEventListener('submit', (e) => {
      e.preventDefault();
      
      const newKey = refGudang.push().key;
      const data = {
        id: newKey,
        nama: document.getElementById('nama').value,
        sku: document.getElementById('sku').value,
        kategori: document.getElementById('kategori').value,
        stok: parseInt(document.getElementById('stok').value),
        satuan: document.getElementById('satuan').value,
        updatedAt: Date.now()
      };

      refGudang.child(newKey).set(data, (error) => {
        if (!error) {
          document.getElementById('form-barang').reset();
        } else {
          alert("Gagal menambahkan barang: " + error.message);
        }
      });
    });

    // 2. LISTEN REALTIME SYNC DARI FIREBASE (Otomatis Update HP A & B)
    refGudang.on('value', (snapshot) => {
      dataBarangGudang = snapshot.val() || {};
      renderListBarang(dataBarangGudang);
    });

    // 3. RENDER TAMPILAN BARANG
    function renderListBarang(dataMap) {
      const listContainer = document.getElementById('list-barang');
      listContainer.innerHTML = '';

      const keys = Object.keys(dataMap);
      if (keys.length === 0) {
        listContainer.innerHTML = `<div class="bg-white p-6 rounded-xl text-center text-slate-400 text-sm">Belum ada barang di gudang.</div>`;
        document.getElementById('total-jenis').innerText = '0';
        document.getElementById('total-stok').innerText = '0';
        return;
      }

      let totalStokFisik = 0;

      keys.reverse().forEach(key => {
        const item = dataMap[key];
        totalStokFisik += parseInt(item.stok || 0);

        const card = document.createElement('div');
        card.className = "bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between gap-3 item-card";
        card.dataset.search = `${item.nama.toLowerCase()} ${item.sku.toLowerCase()}`;

        card.innerHTML = `
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2">
              <span class="text-xs bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded font-mono font-medium">${item.sku}</span>
              <span class="text-xs text-indigo-600 font-medium">${item.kategori}</span>
            </div>
            <h4 class="font-semibold text-slate-800 text-sm truncate mt-0.5">${item.nama}</h4>
            <p class="text-xs text-slate-500 mt-1">
              Stok: <span class="font-bold text-slate-800 text-sm">${item.stok}</span> ${item.satuan}
            </p>
          </div>

          <div class="flex items-center gap-1.5">
            <button onclick="ubahStok('${item.id}', -1)" class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-base flex items-center justify-center active:scale-95 transition">-</button>
            <button onclick="ubahStok('${item.id}', 1)" class="w-8 h-8 rounded-lg bg-indigo-100 hover:bg-indigo-200 text-indigo-700 font-bold text-base flex items-center justify-center active:scale-95 transition">+</button>
            <button onclick="hapusBarang('${item.id}')" class="w-8 h-8 rounded-lg bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs flex items-center justify-center active:scale-95 transition ml-1">
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>
        `;

        listContainer.appendChild(card);
      });

      document.getElementById('total-jenis').innerText = keys.length;
      document.getElementById('total-stok').innerText = totalStokFisik;
    }

    // 4. UBAH STOK REALTIME (+ / -)
    function ubahStok(id, delta) {
      const itemRef = refGudang.child(id);
      itemRef.child('stok').transaction((currentStok) => {
        const result = (currentStok || 0) + delta;
        return result < 0 ? 0 : result;
      });
    }

    // 5. HAPUS BARANG
    function hapusBarang(id) {
      if (confirm("Yakin ingin menghapus barang ini dari gudang?")) {
        refGudang.child(id).remove();
      }
    }

    // 6. FILTER PENCARIAN
    function filterBarang() {
      const query = document.getElementById('search').value.toLowerCase();
      const cards = document.querySelectorAll('.item-card');
      cards.forEach(card => {
        if (card.dataset.search.includes(query)) {
          card.classList.remove('hidden');
        } else {
          card.classList.add('hidden');
        }
      });
    }
  </script>
</body>
</html>
