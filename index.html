<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apk Ikan - Store Ikan</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase Realtime Database -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 pb-10">

    <!-- Header -->
    <div class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-50 flex justify-between items-center">
        <h1 class="font-bold text-lg">Apk Ikan</h1>
        <span id="status-badge" class="text-xs bg-blue-800 px-2.5 py-1 rounded-full">Menghubungkan...</span>
    </div>

    <div class="max-w-md mx-auto p-4 space-y-4">

        <!-- Kode Toko Sync -->
        <div class="bg-white p-3 rounded-lg shadow-sm border border-gray-200">
            <label class="block text-xs font-bold text-gray-600 mb-1">KODE TOKO (HARUS SAMA DI SEMUA HP):</label>
            <div class="flex gap-2">
                <input type="text" id="store-code" value="STORE-IKAN-01" class="flex-1 bg-gray-50 border rounded px-3 py-1.5 text-sm font-semibold text-blue-600 focus:outline-none focus:ring-1 focus:ring-blue-500">
                <button onclick="connectStore()" class="bg-blue-600 text-white px-3 py-1.5 rounded text-sm font-semibold">Hubungkan</button>
            </div>
        </div>

        <!-- Form Tambah Stok -->
        <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200 space-y-3">
            <h2 class="font-bold text-gray-700 text-sm border-b pb-2">Tambah Data Ikan</h2>
            
            <div>
                <label class="block text-xs text-gray-500 mb-1">Nama Ikan</label>
                <input type="text" id="fish-name" placeholder="Nama ikan..." class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500">
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-xs text-gray-500 mb-1">Berat (Kg)</label>
                    <input type="number" id="fish-weight" step="0.1" placeholder="0" class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs text-gray-500 mb-1">Jumlah (Ekor)</label>
                    <input type="number" id="fish-count" placeholder="0" class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500">
                </div>
            </div>

            <div>
                <label class="block text-xs text-gray-500 mb-1">Foto Ikan (Opsional)</label>
                <input type="file" id="fish-photo" accept="image/*" class="w-full text-xs text-gray-500">
            </div>

            <button onclick="saveItem()" id="btn-save" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2 rounded text-sm transition">
                Simpan Data Online
            </button>
        </div>

        <!-- Daftar Stok -->
        <div class="space-y-2">
            <h2 class="font-bold text-gray-700 text-sm">Daftar Stok Ikan (Online)</h2>
            <div id="stock-list" class="space-y-2">
                <div class="text-center py-6 text-gray-400 text-xs">Memuat data...</div>
            </div>
        </div>

    </div>

    <!-- Script Online -->
    <script>
        const firebaseConfig = {
            databaseURL: "https://store-ikan-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        let currentStoreCode = "STORE-IKAN-01";
        let dbRef = null;

        function connectStore() {
            const inputCode = document.getElementById('store-code').value.trim();
            if (!inputCode) return alert("Kode Toko wajib diisi!");

            if (dbRef) dbRef.off();

            currentStoreCode = inputCode.replace(/[^a-zA-Z0-9_-]/g, '_');
            document.getElementById('status-badge').innerText = "Menghubungkan...";

            dbRef = db.ref('stores/' + currentStoreCode + '/items');

            dbRef.on('value', (snapshot) => {
                document.getElementById('status-badge').innerText = "Online (Realtime)";
                renderStock(snapshot.val());
            }, (err) => {
                document.getElementById('status-badge').innerText = "Gagal Konek";
            });
        }

        function renderStock(data) {
            const stockList = document.getElementById('stock-list');
            if (!data) {
                stockList.innerHTML = `<div class="bg-white p-4 rounded text-center text-gray-400 text-xs border">Belum ada data stok tersimpan.</div>`;
                return;
            }

            const keys = Object.keys(data);
            let html = '';
            keys.reverse().forEach(key => {
                const item = data[key];
                const photoHtml = item.photo ? `<img src="${item.photo}" class="w-14 h-14 object-cover rounded border">` : `<div class="w-14 h-14 bg-gray-200 rounded flex items-center justify-center text-gray-400 text-xs">No Pic</div>`;

                html += `
                    <div class="bg-white p-3 rounded shadow-sm border flex gap-3 items-center">
                        ${photoHtml}
                        <div class="flex-1">
                            <h3 class="font-bold text-gray-800 text-sm">${item.name}</h3>
                            <p class="text-xs text-gray-600">${item.weight || 0} Kg | ${item.count || 0} Ekor</p>
                            <p class="text-[10px] text-gray-400 mt-0.5">${item.updatedAt || ''}</p>
                        </div>
                        <button onclick="deleteItem('${key}')" class="text-red-500 p-2 text-xs font-semibold">Hapus</button>
                    </div>
                `;
            });
            stockList.innerHTML = html;
        }

        function saveItem() {
            const name = document.getElementById('fish-name').value.trim();
            const weight = document.getElementById('fish-weight').value;
            const count = document.getElementById('fish-count').value;
            const photoInput = document.getElementById('fish-photo');

            if (!name) return alert("Isi nama ikan!");

            const btnSave = document.getElementById('btn-save');
            btnSave.disabled = true;
            btnSave.innerText = "Menyimpan...";

            const now = new Date();
            const timeStr = now.toLocaleDateString('id-ID') + ' ' + now.toLocaleTimeString('id-ID', {hour: '2-digit', minute:'2-digit'});

            const sendData = (photoBase64 = '') => {
                dbRef.push({
                    name: name,
                    weight: weight || 0,
                    count: count || 0,
                    photo: photoBase64,
                    updatedAt: timeStr
                }).then(() => {
                    document.getElementById('fish-name').value = '';
                    document.getElementById('fish-weight').value = '';
                    document.getElementById('fish-count').value = '';
                    document.getElementById('fish-photo').value = '';
                    btnSave.disabled = false;
                    btnSave.innerText = "Simpan Data Online";
                }).catch(err => {
                    alert("Gagal: " + err.message);
                    btnSave.disabled = false;
                    btnSave.innerText = "Simpan Data Online";
                });
            };

            if (photoInput.files && photoInput.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => sendData(e.target.result);
                reader.readAsDataURL(photoInput.files[0]);
            } else {
                sendData('');
            }
        }

        function deleteItem(key) {
            if (confirm("Hapus data ini?")) {
                dbRef.child(key).remove();
            }
        }

        window.onload = connectStore;
    </script>
</body>
</html>
